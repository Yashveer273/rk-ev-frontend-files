<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clusters</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">VC</span>
          <div><strong>Vehicle Cluster</strong><small>Management</small></div>
        </div>
        <nav>
          <a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a
          ><a class="active" href="clusters.html"
            ><i class="bi bi-diagram-3"></i> Clusters</a
          ><a href="create-cluster.html"
            ><i class="bi bi-plus-circle"></i> Create Cluster</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <h1>Vehicle Clusters</h1>
            <p>Search, inspect, edit and manage cluster records.</p>
          </div>
          <a class="btn btn-primary" href="create-cluster.html"
            ><i class="bi bi-plus-lg"></i> New Cluster</a
          >
        </header>
        <section class="card-panel">
          <div class="d-flex justify-content-between gap-3 flex-wrap mb-3">
            <input
              id="search"
              class="form-control searchbar"
              placeholder="Search owner, ID, city or state..."
            /><select id="pageSize" class="form-select" style="width: 100px">
              <option>10</option>
              <option>25</option>
              <option>50</option>
            </select>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Owner</th>
                  <th>Location</th>
                  <th>Capacity</th>
                  <th>Vehicles</th>
                  <th>KYC</th>
                  <th>Service</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div
            class="d-flex justify-content-between align-items-center flex-wrap gap-2"
          >
            <small id="count" class="text-muted"></small>
            <ul id="pagination" class="pagination mb-0"></ul>
          </div>
        </section>
      </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/clusters.js"></script>
  </body>
</html>
