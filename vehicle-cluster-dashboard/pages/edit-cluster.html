<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Cluster</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="../css/app.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">VC</span><div><strong>Vehicle Cluster</strong><small>Management</small></div></div><nav><a href="dashboard.html"><i class="bi bi-grid-1x2"></i> Dashboard</a><a href="clusters.html"><i class="bi bi-diagram-3"></i> Clusters</a><a class="active" href="create-cluster.html"><i class="bi bi-plus-circle"></i> Create Cluster</a></nav></aside><main class="main"><header class="topbar"><div><h1>Edit Vehicle Cluster</h1><p>Update the cluster record.</p></div><a class="btn btn-light" href="clusters.html">Back</a></header><section class="card-panel page-card"><form id="form"><div class="section-title">Owner & Cluster</div><div class="row g-3"><div class="col-md-6"><label class="form-label">Owner Name *</label><input required name="vehicleClusterOwnerName" class="form-control"></div><div class="col-md-6"><label class="form-label">Owner ID *</label><input required name="vehicleClusterOwnerId" class="form-control"></div><div class="col-md-6"><label class="form-label">Capacity *</label><input required type="number" name="vehicleCapacity" class="form-control"></div><div class="col-md-6"><label class="form-label">KYC Status</label><select name="kycStatus" class="form-select"><option value="Pending">Pending</option><option value="Verified">Verified</option><option value="Rejected">Rejected</option></select></div></div><div class="section-title">Vehicle Location</div><div class="row g-3"><div class="col-md-3"><label class="form-label">Latitude *</label><input required type="number" step="any" name="lat" class="form-control"></div><div class="col-md-3"><label class="form-label">Longitude *</label><input required type="number" step="any" name="long" class="form-control"></div><div class="col-md-3"><label class="form-label">ZIP Code *</label><input required name="zipCode" class="form-control"></div><div class="col-md-3"><label class="form-label">State *</label><input required name="state" class="form-control"></div><div class="col-md-6"><label class="form-label">City *</label><input required name="city" class="form-control"></div><div class="col-md-6"><label class="form-label">Street Address *</label><input required name="streetAddress" class="form-control"></div></div><div class="section-title">Owner Details</div><div class="row g-3"><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div><div class="col-md-6"><label class="form-label">PAN</label><input name="pan" class="form-control"></div><div class="col-md-6"><label class="form-label">Aadhaar</label><input name="aadhaar" class="form-control"></div><div class="col-md-6"><label class="form-label">Image URL</label><input name="image" class="form-control"></div></div><div class="section-title">Service & Payments</div><div class="row g-3"><div class="col-md-4"><label class="form-label">Service Start</label><input type="date" name="serviceStart" class="form-control"></div><div class="col-md-4"><label class="form-label">Service End</label><input type="date" name="serviceEnd" class="form-control"></div><div class="col-md-4"><label class="form-label">Service Status</label><input name="serviceStatus" class="form-control" placeholder="Active / Inactive"></div><div class="col-md-6"><label class="form-label">Operator Payment Amount</label><input type="number" step="0.01" name="operatorPaymentAmount" class="form-control"></div><div class="col-md-6"><label class="form-label">Investor Payment Amount</label><input type="number" step="0.01" name="investorPaymentAmount" class="form-control"></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" href="clusters.html">Cancel</a><button class="btn btn-primary" type="submit">Save Changes</button></div><div id="msg" class="mt-3"></div></form></section></main></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/create-cluster.js"></script></body></html>
