<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin - Register New EV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar Component -->
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title text-dark fw-semibold fs-4">Register New Electric Vehicle</h1>
        <div class="topbar-right d-flex align-items-center gap-3">
          <a href="ev-fleet.html" class="btn btn-outline-dark btn-sm fw-medium">
            <i class="bi bi-arrow-left me-1"></i> Back to Fleet
          </a>
          <div class="role-badge">Role: Super Admin</div>
        </div>
      </header>

      <div class="content-body py-4" style="max-width: 1000px; margin: 0 auto;">
        
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-body p-4 p-md-5">
            <form id="createVehicleForm" class="needs-validation" novalidate>
              
              <!-- Section 1 -->
              <h6 class="fw-bold mb-3 pb-2 border-bottom text-dark">1. Core Vehicle Information</h6>
              <div class="row g-3 mb-4">
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Service Count <span class="text-danger">*</span></label>
                  <input type="number" min="0" id="createVehicleServiceNo" class="form-control" placeholder="e.g. 0, 1, 2..." required>
                  <div class="form-text text-muted" style="font-size: 0.75rem;">Total times serviced</div>
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Number Plate <span class="text-danger">*</span></label>
                  <input type="text" id="createVehicleNoPlate" class="form-control text-uppercase" placeholder="DL01EV1234" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Vehicle Type <span class="text-danger">*</span></label>
                  <select id="createVehicleType" class="form-select" required>
                    <option value="" disabled selected>Select category...</option>
                    <option value="2-Wheeler">2-Wheeler</option>
                    <option value="3-Wheeler">3-Wheeler</option>
                    <option value="4-Wheeler">4-Wheeler</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Operational Status</label>
                  <select id="createStatus" class="form-select">
                    <option value="Active">Active</option>
                    <option value="In Parking">In Parking</option>
                    <option value="In-service">In-service</option>
                    <option value="Non-active">Non-active</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold text-secondary">Model Name <span class="text-danger">*</span></label>
                  <input type="text" id="createVehicleModelName" class="form-control" placeholder="e.g. Ather 450X" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold text-secondary">Year Model <span class="text-danger">*</span></label>
                  <input type="number" id="createVehicleYearModel" class="form-control" value="2026" required>
                </div>
              </div>

              <!-- Section 2 -->
              <h6 class="fw-bold mb-3 pb-2 border-bottom text-dark">2. Technical Telemetry Specifications</h6>
              <div class="row g-3 mb-4">
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Motor Power (kW)</label>
                  <input type="number" step="0.1" id="createMotorPower" class="form-control" placeholder="e.g. 6.2">
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Battery Capacity (kWh)</label>
                  <input type="number" step="0.1" id="createBatteryCapacity" class="form-control" placeholder="e.g. 3.7">
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Max Range (KM)</label>
                  <input type="number" id="createRangeKm" class="form-control" placeholder="e.g. 105">
                </div>
                <div class="col-md-3">
                  <label class="form-label small fw-semibold text-secondary">Top Speed (km/h) <span class="text-danger">*</span></label>
                  <input type="number" id="createTopSpeed" class="form-control" placeholder="e.g. 85" required>
                </div>
              </div>

              <!-- Section 3 -->
              <h6 class="fw-bold mb-3 pb-2 border-bottom text-dark">3. Commercial & Procurement Details</h6>
              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label class="form-label small fw-semibold text-secondary">Company Name</label>
                  <input type="text" id="createCompanyName" class="form-control" placeholder="e.g. Ather Energy">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-semibold text-secondary">Purchase Location</label>
                  <input type="text" id="createPurchaseLocation" class="form-control" placeholder="e.g. Gurgaon Hub">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-semibold text-secondary">Purchase Price (₹)</label>
                  <input type="number" id="createPurchasePrice" class="form-control" placeholder="e.g. 125000">
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <button type="reset" class="btn btn-outline-secondary px-4">Clear</button>
                <button type="submit" id="submitBtn" class="btn btn-dark px-5 fw-semibold" disabled>
                  Register Asset
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Smart Form Validation Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("createVehicleForm");
      const submitBtn = document.getElementById("submitBtn");

      function checkFormValidity() {
        if (form.checkValidity()) {
          submitBtn.removeAttribute("disabled");
        } else {
          submitBtn.setAttribute("disabled", "true");
        }
      }

      form.addEventListener("input", checkFormValidity);
      form.addEventListener("change", checkFormValidity);
      checkFormValidity();
    });
  </script>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config-manager.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/evFleetApiClient.js"></script>[cite: 5]
  <script src="../js/js2/ev-fleet-actions.js"></script>
  <script>
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('sidebar-container').innerHTML = html;
        document.querySelector('[data-page="ev-fleet"]')?.classList.add('active');
      });
  </script>
</body>
</html>
