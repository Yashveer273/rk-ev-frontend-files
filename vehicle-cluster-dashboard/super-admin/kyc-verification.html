<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYC Verification CRM - Super Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />

  <style>
    .pagination-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f8fafc;
      border-top: 1px solid #e5e7eb;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }
    .kyc-tab-btn {
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="topbar px-4 py-3 bg-white border-bottom d-flex justify-content-between align-items-center">
        <h1 class="page-title fs-4 m-0">KYC Verification CRM</h1>
        <div class="role-badge">Super Admin</div>
      </header>

      <div class="content-body p-4">
        
        <!-- HEADER STATUS TABS -->
        <div class="d-flex flex-wrap gap-2 mb-4" id="kycStatusTabs">
          <button type="button" class="btn btn-warning kyc-tab-btn active px-4" data-status="Pending">
            <i class="bi bi-clock-history me-1"></i> Pending KYC
          </button>
          <button type="button" class="btn btn-outline-success kyc-tab-btn px-4" data-status="Verified">
            <i class="bi bi-check-circle-fill me-1"></i> Verified / Completed
          </button>
          <button type="button" class="btn btn-outline-danger kyc-tab-btn px-4" data-status="Rejected">
            <i class="bi bi-x-circle-fill me-1"></i> Rejected KYC
          </button>
        </div>

        <!-- SEARCH & RELOAD BAR -->
        <div class="operation-card mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-8">
              <input type="text" id="searchInput" class="form-control" placeholder="Search by Owner Name, Email, ID or City..." />
            </div>
            <div class="col-md-4 text-end">
              <button type="button" id="reloadKycBtn" class="btn btn-outline-secondary w-100 fw-bold">
                <i class="bi bi-arrow-clockwise"></i> <span id="reloadBtnText">Refresh List</span>
              </button>
            </div>
          </div>
        </div>

        <!-- CRM TABLE WITH PAGINATION -->
        <div class="operation-card p-0 overflow-hidden shadow-sm">
          <div class="p-4 pb-3 d-flex justify-content-between align-items-center bg-white border-bottom">
            <div>
              <h5 class="m-0 fw-bold text-dark" id="tableTitle"><i class="bi bi-shield-shaded text-warning"></i> Pending KYC Requests</h5>
              <p class="text-muted small mb-0" id="tableSubtitle">Review cluster registrations where KYC submission fields are filled and pending review.</p>
            </div>
          </div>

          <div class="operator-table-wrapper border-0 rounded-0">
            <table class="operator-table m-0">
              <thead>
                <tr>
                  <th>Owner ID / Name</th>
                  <th>Contact & KYC ID</th>
                  <th>Location (City/State)</th>
                  <th>Document Link</th>
                  <th>Pan</th>
                  <th>Submission Date</th>
                  <th class="text-end" id="actionHeader">Actions</th>
                </tr>
              </thead>
              <tbody id="kycTableRows">
                <tr>
                  <td colspan="6" class="text-center py-4 text-muted">Loading requests...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination Bar -->
          <div class="pagination-container">
            <span class="text-muted small" id="paginationInfo">Showing 0-0 of 0 requests</span>
            <ul class="pagination pagination-sm m-0" id="paginationControls"></ul>
          </div>
        </div>

        <div id="kycVerificationMessage" class="status-box mt-3"></div>
      </div>
    </main>
  </div>

  <!-- Core Scripts -->
  <script src="../js/config-manager.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/super-admin-api.js"></script>
  
  <script>
    fetch('../components/sidebar.html').then(res => res.text()).then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      document.querySelector('[data-page="kyc-verification"]')?.classList.add('active');
    });

    let currentActiveStatus = "Pending"; 
    let currentPage = 1;
    const rowsPerPage = 5;
    let totalPagesCache = 1;
    let totalItemsCache = 0;

    function setReloadButtonLoading(isLoading) {
      const reloadBtn = document.getElementById("reloadKycBtn");
      const btnText = document.getElementById("reloadBtnText");
      if (!reloadBtn || !btnText) return;

      if (isLoading) {
        reloadBtn.disabled = true;
        btnText.innerHTML = `<span class="spinner-border spinner-border-sm me-1" role="status"></span> Loading...`;
      } else {
        reloadBtn.disabled = false;
        btnText.innerHTML = `Refresh List`;
      }
    }

    async function fetchKycListByStatus() {
      const tbody = document.getElementById("kycTableRows");
      if (!tbody) return;

      setReloadButtonLoading(true);
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Fetching ${currentActiveStatus.toLowerCase()} requests...</td></tr>`;

      try {
        // Fresh API call for the selected status with pagination parameters
        const res = await SuperAdminAPI.getAllKycRequests(currentActiveStatus, currentPage, rowsPerPage);
        
        let clusters = [];
        if (res?.data && Array.isArray(res.data)) {
          clusters = res.data;
          totalPagesCache = res.totalPages || 1;
          totalItemsCache = res.totalItems || clusters.length;
        } else if (Array.isArray(res)) {
          clusters = res;
          totalItemsCache = clusters.length;
          totalPagesCache = Math.ceil(totalItemsCache / rowsPerPage) || 1;
        }

        renderKycTable(clusters);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Failed to load requests: ${err.message}</td></tr>`;
      } finally {
        setReloadButtonLoading(false);
      }
    }

    function renderKycTable(clusters) {
      const tbody = document.getElementById("kycTableRows");
      const searchInput = document.getElementById("searchInput");
      const paginationInfo = document.getElementById("paginationInfo");
      const paginationControls = document.getElementById("paginationControls");
      const actionHeader = document.getElementById("actionHeader");
      if (!tbody) return;

      if (currentActiveStatus === 'Verified') {
        actionHeader.style.display = "none";
      } else {
        actionHeader.style.display = "";
        actionHeader.className = "text-end";
      }

      const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : "";

      const filteredData = clusters.filter(c => {
        const ownerName = (c.vehicleClusterDetails?.ownerName || c.vehicleClusterOwnerName || "").toLowerCase();
        const ownerId = (c.vehicleClusterOwnerId || "").toLowerCase();
        const email = (c.vehicleClusterDetails?.email || "").toLowerCase();
        const city = (c.vehicleClusterLocation?.city || "").toLowerCase();
        return ownerName.includes(searchTerm) || ownerId.includes(searchTerm) || email.includes(searchTerm) || city.includes(searchTerm);
      });

      if (filteredData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No ${currentActiveStatus.toLowerCase()} KYC requests found.</td></tr>`;
        if (paginationInfo) paginationInfo.textContent = "Showing 0-0 of 0 requests";
        if (paginationControls) paginationControls.innerHTML = "";
        return;
      }

      const startIdx = (currentPage - 1) * rowsPerPage;
      const endIdx = startIdx + filteredData.length;

      tbody.innerHTML = filteredData.map(c => {
        const clusterId = c._id || c.vehicleClusterOwnerId;
        const ownerId = c.vehicleClusterOwnerId || "N/A";
        const ownerName = c.vehicleClusterDetails?.ownerName || c.vehicleClusterOwnerName || "Unknown";
        const email = c.vehicleClusterDetails?.email || "N/A";
        const kycId = c.kyc?.kycId || "N/A";
        const pan = c.kyc?.pan || "N/A";
        const documentUrl = c.kyc?.documentUrl || "#";
        const city = c.vehicleClusterLocation?.city || "N/A";
        const state = c.vehicleClusterLocation?.state || "N/A";
        
        let formattedDate = "N/A";
        if (c.kyc?.submittedAt || c.createdAt) {
          const dateObj = new Date(c.kyc?.submittedAt || c.createdAt);
          formattedDate = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        let actionColumnHtml = '';
        if (currentActiveStatus === 'Pending') {
          actionColumnHtml = `
            <td class="text-end">
              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-sm btn-success fw-bold px-3 py-1 execute-kyc-btn" data-id="${clusterId}" data-status="Verified">
                  <i class="bi bi-check-circle"></i> Verify
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger fw-bold px-3 py-1 execute-kyc-btn" data-id="${clusterId}" data-status="Rejected">
                  <i class="bi bi-x-circle"></i> Reject
                </button>
              </div>
            </td>
          `;
        } else if (currentActiveStatus === 'Rejected') {
          actionColumnHtml = `
            <td class="text-end">
              <button type="button" class="btn btn-sm btn-success fw-bold px-3 py-1 execute-kyc-btn" data-id="${clusterId}" data-status="Verified">
                <i class="bi bi-arrow-repeat"></i> Re-Verify
              </button>
            </td>
          `;
        } else {
          actionColumnHtml = '';
        }

        return `
          <tr>
            <td>
              <strong>${ownerId}</strong><br>
              <span class="text-secondary small">${ownerName}</span>
            </td>
            <td>
              <span class="small d-block"><i class="bi bi-envelope"></i> ${email}</span>
              <span class="small text-muted font-monospace">ID: ${kycId}</span>
            </td>
            <td>${city}, ${state}</td>
            <td>
              <a href="${documentUrl}" target="_blank" class="btn btn-sm btn-outline-primary py-0 px-2">
                <i class="bi bi-file-earmark-image"></i> View Doc
              </a>
             
            </td>
              <td>
              
              <span class="small text-muted font-monospace">No. ${pan}</span>
          
            </td>
            <td><span class="small text-muted"><i class="bi bi-clock"></i> ${formattedDate}</span></td>
            ${actionColumnHtml}
          </tr>
        `;
      }).join("");

      // Verify/Reject action button click listener
      document.querySelectorAll(".execute-kyc-btn").forEach(btn => {
        btn.addEventListener("click", async function() {
          const targetId = this.getAttribute("data-id");
          const targetStatus = this.getAttribute("data-status");
          const msgBox = document.getElementById("kycVerificationMessage");

          try {
            this.disabled = true;
            this.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;

            await SuperAdminAPI.verifyKyc(targetId, targetStatus);

            if (msgBox) {
              msgBox.innerHTML = `<div class="alert alert-success py-2">Cluster KYC successfully updated to <strong>${targetStatus}</strong>!</div>`;
            }

            // Refresh current list after status update
            await fetchKycListByStatus();
          } catch (error) {
            if (msgBox) {
              msgBox.innerHTML = `<div class="alert alert-danger py-2">Error: ${error.message}</div>`;
            }
            this.disabled = false;
          }
        });
      });

      if (paginationInfo) {
        paginationInfo.textContent = `Showing ${totalItemsCache > 0 ? startIdx + 1 : 0}-${endIdx} of ${totalItemsCache} requests`;
      }

      if (paginationControls) {
        let pagesHtml = `
          <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${currentPage - 1}">Prev</a>
          </li>
        `;

        for (let i = 1; i <= totalPagesCache; i++) {
          pagesHtml += `
            <li class="page-item ${currentPage === i ? 'active' : ''}">
              <a class="page-link" href="#" data-page="${i}">${i}</a>
            </li>
          `;
        }

        pagesHtml += `
          <li class="page-item ${currentPage === totalPagesCache ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${currentPage + 1}">Next</a>
          </li>
        `;

        paginationControls.innerHTML = pagesHtml;

        paginationControls.querySelectorAll(".page-link").forEach(link => {
          link.addEventListener("click", function(e) {
            e.preventDefault();
            const targetPage = parseInt(this.getAttribute("data-page"));
            if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= totalPagesCache) {
              currentPage = targetPage;
              fetchKycListByStatus();
            }
          });
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Tab Switching Logic
      document.querySelectorAll("#kycStatusTabs button").forEach(btn => {
        btn.addEventListener("click", function() {
          document.querySelectorAll("#kycStatusTabs button").forEach(b => {
            b.classList.remove("active", "btn-warning", "btn-success", "btn-danger");
            b.classList.add("btn-outline-secondary");
          });

          this.classList.remove("btn-outline-secondary");
          currentActiveStatus = this.getAttribute("data-status");
          currentPage = 1; // Reset to page 1 on tab switch

          if (currentActiveStatus === 'Pending') this.classList.add("active", "btn-warning");
          else if (currentActiveStatus === 'Verified') this.classList.add("active", "btn-success");
          else if (currentActiveStatus === 'Rejected') this.classList.add("active", "btn-danger");

          document.getElementById("tableTitle").innerHTML = `<i class="bi bi-shield-shaded text-${currentActiveStatus === 'Verified' ? 'success' : currentActiveStatus === 'Rejected' ? 'danger' : 'warning'}"></i> ${currentActiveStatus} KYC Requests`;
          
          fetchKycListByStatus();
        });
      });

      fetchKycListByStatus();

      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          currentPage = 1;
          fetchKycListByStatus();
        });
      }

      const reloadBtn = document.getElementById("reloadKycBtn");
      if (reloadBtn) {
        reloadBtn.addEventListener("click", fetchKycListByStatus);
      }
    });
  </script>
</body>
</html>
