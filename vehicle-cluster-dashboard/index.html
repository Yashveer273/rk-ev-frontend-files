<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Cluster Portal - Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .welcome-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark">Vehicle Cluster Platform</h2>
      <p class="text-muted small">Select your portal to access enterprise management tools</p>
    </div>

    <div class="card welcome-card p-4 p-md-5">
      <div class="d-grid gap-3">
        <a href="super-admin/dashboard.html" class="btn btn-dark py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-shield-fill-check fs-5"></i> Super Admin Portal
        </a>
        <a href="cluster-owner/login.html" class="btn btn-outline-primary py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-building fs-5"></i> Cluster Owner Portal
        </a>
      </div>
    </div>

    <div class="text-center mt-4 text-muted" style="font-size: 11px;">
      Enterprise Transport & EV Fleet Management System
    </div>
  </div>

  <script src="js/config-manager.js"></script>
  <script>
    const currentConfig = ClusterConfig.getConfig();
    if (!currentConfig.USER_ROLE) {
      ClusterConfig.saveConfig({ USER_ROLE: "super-admin" });
    }
  </script>
</body>
</html>
