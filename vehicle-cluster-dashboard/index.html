<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Cluster Portal - Welcome</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow-sm p-4 text-center" style="max-width: 450px; width: 100%; border-radius: 12px;">
    <h3 class="fw-bold mb-2">Vehicle Cluster Portal</h3>
    <p class="text-muted small mb-4">Select your role to access the management dashboard.</p>

    <div class="d-grid gap-3">
      <a href="super-admin/dashboard.html" class="btn btn-dark py-3 fw-bold">
        👑 Login as Super Admin
      </a>
      <a href="cluster-owner/dashboard.html" class="btn btn-outline-primary py-3 fw-bold">
        👤 Login as Cluster Owner
      </a>
    </div>

    <div class="mt-4 text-muted" style="font-size: 11px;">
      Powered by Modular Vehicle Cluster Architecture
    </div>
  </div>

  <!-- Config & Core JS -->
  <script src="js/config-manager.js"></script>
  <script>
    // Default initial config check
    const currentConfig = ClusterConfig.getConfig();
    if (!currentConfig.USER_ROLE) {
      ClusterConfig.saveConfig({ USER_ROLE: "super-admin" });
    }
  </script>
</body>
</html>
