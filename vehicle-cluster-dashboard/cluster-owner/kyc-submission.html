<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit KYC - Cluster Owner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">Submit KYC</h1>
        <div class="role-badge">Cluster Owner</div>
      </header>

      <div class="content-body">
        <div class="operation-card" style="max-width: 550px;">
          <h5><i class="bi bi-file-earmark-check-fill text-primary"></i> Identity Document Verification</h5>
          <div class="operation-description">Submit identity details for Super Admin review. Status will update to 'Pending'.</div>

          <form id="kycForm">
            <div class="mb-3">
              <label class="form-label">Government Identification Number</label>
              <input type="text" name="aadhaar" class="form-control" placeholder="Enter government identity number" required />
            </div>

            <div id="kycMessage" class="status-box"></div>

            <button type="submit" class="btn btn-primary mt-2">
              <i class="bi bi-send"></i> Submit Verification
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config-manager.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cluster-owner-api.js"></script>
  <script src="../js/js2/owner-actions.js"></script>
  <script>
    fetch('../components/sidebar.html').then(res => res.text()).then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      document.querySelector('[data-page="kyc-submission"]')?.classList.add('active');
    });
  </script>
</body>
</html>
