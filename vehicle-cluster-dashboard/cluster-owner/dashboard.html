<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cluster Owner Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="topbar">
        <h1 class="page-title">Owner Dashboard</h1>
        <div class="topbar-right">
          <div class="role-badge">Role: Cluster Owner</div>
          <div class="cluster-badge">Cluster: <span data-cluster-id>-</span></div>
        </div>
      </header>

      <div class="content-body">
        <!-- Cluster Info Cards -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="info-card">
              <div class="info-label">Active Cluster ID</div>
              <div class="info-value" data-cluster-id>-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="info-card">
              <div class="info-label">Owner ID</div>
              <div class="info-value" id="ownerIdDisplay">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="info-card">
              <div class="info-label">Current Role</div>
              <div class="info-value">cluster-owner</div>
            </div>
          </div>
        </div>

        <!-- Owner Details Form -->
        <div class="operation-card">
          <h5><i class="bi bi-person-lines-fill text-primary"></i> Owner Details</h5>
          <div class="operation-description">Update your profile and contact information.</div>

          <form id="clusterOwnerOwnerForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Vehicle Cluster Owner ID</label>
                <input type="text" name="vehicleClusterOwnerId" id="clusterOwnerOwnerId" class="form-control" required readonly />
              </div>
              <div class="col-md-6">
                <label class="form-label">Owner Name</label>
                <input type="text" name="ownerName" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">PAN</label>
                <input type="text" name="pan" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Image URL</label>
                <input type="text" name="image" class="form-control" />
              </div>
            </div>

            <div id="clusterOwnerOwnerMessage" class="status-box"></div>

            <button type="submit" class="btn btn-primary mt-3">
              <i class="bi bi-save"></i> Save Details
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config-manager.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cluster-owner-api.js"></script>
  <script src="../js/js2/owner-actions.js"></script>
  <script>
    fetch('../components/sidebar.html').then(res => res.text()).then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      document.querySelector('[data-page="owner-dashboard"]')?.classList.add('active');
    });
  </script>
</body>
</html>
